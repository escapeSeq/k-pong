# fly.toml app configuration file generated for k-pong-backend on 2025-12-02T20:10:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'k-pong-backend'
primary_region = 'arn'

[env]
  PORT = "8080"
  NODE_ENV = "production"
  FRONTEND_URL = "https://k-pong.fly.dev"
  PLAYER_SERVICE_URL = "http://k-pong-player-service.internal:5001"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
